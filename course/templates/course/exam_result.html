<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ course.name }} - Exam Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    {% if submission %}

        <div class="text-center">

            {% if submission.score == submission.total %}

                <h1 class="text-success">
                    Congratulations!
                </h1>

            {% else %}

                <h1>
                    Exam Result
                </h1>

            {% endif %}

            <h3 class="mt-4">
                {{ course.name }}
            </h3>

            <div class="card mt-4">

                <div class="card-body">

                    <h4>
                        Score: {{ submission.score }} / {{ submission.total }}
                    </h4>

                    <p>
                        Exam submitted successfully.
                    </p>

                </div>

            </div>

            <a
                href="{% url 'course_details' course.id %}"
                class="btn btn-primary mt-4"
            >
                Back to Course
            </a>

        </div>

    {% else %}

        <div class="alert alert-warning">
            No exam result found.
        </div>

    {% endif %}

</div>

</body>
</html>
